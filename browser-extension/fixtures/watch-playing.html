<!doctype html>
<html lang="en">
<head><title>Never Gonna Give You Up - YouTube</title></head>
<body>
<ytd-app>
  <ytd-watch-flexy video-id="dQw4w9WgXcQ">
    <div id="player-container">
      <div id="movie_player" class="html5-video-player ytp-exp-bottom-control-flexbox playing-mode" tabindex="-1">
        <div class="html5-video-container">
          <video class="video-stream html5-main-video" tabindex="-1"></video>
        </div>
        <div class="ytp-chrome-bottom">
          <div class="ytp-chrome-controls">
            <div class="ytp-left-controls">
              <a class="ytp-prev-button ytp-button" role="button" aria-disabled="true" title="Previous" style="display: none;"></a>
              <button class="ytp-play-button ytp-button" aria-label="Pause (k)" title="Pause (k)"></button>
              <a class="ytp-next-button ytp-button" role="button" aria-disabled="false" title="Next (SHIFT+n)"></a>
              <span class="ytp-volume-area">
                <button class="ytp-mute-button ytp-button" title="Mute (m)"></button>
                <div class="ytp-volume-panel" role="slider" aria-valuemin="0" aria-valuemax="100" aria-valuenow="80" aria-valuetext="80% volume"></div>
              </span>
              <div class="ytp-time-display notranslate"><span class="ytp-time-current">0:10</span><span class="ytp-time-separator"> / </span><span class="ytp-time-duration">3:33</span></div>
            </div>
            <div class="ytp-right-controls">
              <button class="ytp-size-button ytp-button" title="Theater mode (t)"></button>
              <button class="ytp-fullscreen-button ytp-button" title="Full screen (f)"></button>
            </div>
          </div>
        </div>
      </div>
    </div>
    <div id="above-the-fold">
      <div id="title">
        <h1 class="style-scope ytd-watch-metadata"><yt-formatted-string class="style-scope ytd-watch-metadata">Never Gonna Give You Up</yt-formatted-string></h1>
      </div>
    </div>
  </ytd-watch-flexy>
</ytd-app>
</body>
</html>
