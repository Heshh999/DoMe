[project]
name = "dome-agent"
version = "0.1.0"
description = "DoMe Windows user agent and Native Messaging host (runs on Linux/macOS for development with unsupported adapters)."
requires-python = ">=3.12,<3.13"
dependencies = [
    "dome-protocol",
    "websockets>=15.0,<18",
    "httpx>=0.28.1,<0.29",
    "structlog>=25.1,<27",
    "pydantic>=2.10,<3",
    "psutil>=6.1,<8",
    "qrcode>=8.0,<9",
    "pystray>=0.19.5,<0.20",
    "Pillow>=11.0,<13",
    "joserfc>=1.0,<2",
    # Windows-only adapters (marker-gated; never installed elsewhere)
    "pywin32>=308; sys_platform == 'win32'",
    "pycaw>=20240210; sys_platform == 'win32'",
    "comtypes>=1.4.5; sys_platform == 'win32'",
    "winsdk>=1.0.0b10; sys_platform == 'win32'",
]

[project.optional-dependencies]
# Screen view (protocol 1.4, docs/design/screen-view.md §5/§15): the WebRTC worker. Optional so the tray,
# Setup and CI install without it; `dev` pulls it in for the Linux unit tests. On Linux and macOS `av`
# resolves to the stock PyPI wheel, which bundles GPL x264/x265 and is for development ONLY (it never
# ships; KNOWN_ISSUES.md). The shipping LGPL build comes from .github/workflows/ffmpeg-lgpl.yml and will be
# pinned here as a `[tool.uv.sources]` entry with `marker = "sys_platform == 'win32'"` once released (WP0.1).
screen = [
    "aiortc==1.15.0",
    "av>=14,<18",
    # The Windows.Graphics.Capture fallback (dome_agent/screen/worker/capture_wgc.py, MIT). Pinned exactly: DoMe
    # loads only the package's native module and calls its NativeWindowsCapture / NativeMappedFrame API, read from
    # the 2.0.1 source; its Python wrapper needs OpenCV and NumPy, which [tool.uv] exclude-dependencies removes.
    "windows-capture==2.0.1; sys_platform == 'win32'",
]
dev = [
    "dome-agent[screen]",
    "pytest>=8.3,<10",
    "pytest-asyncio>=0.25,<2",
    "mypy>=1.14,<3",
    "ruff>=0.9,<1",
    "types-psutil>=6.1",
    # Lets `mypy --config-file mypy-windows.ini` check every pywin32 call on the Windows code paths
    # (a wrong module for ProcessIdToSessionId broke the first real Windows run).
    "types-pywin32>=312.0.0.20261006",
]
build = [
    "pyinstaller>=6.11,<7",
]

[project.scripts]
dome-agent = "dome_agent.cli:main"
dome-native-host = "dome_agent.bridge.host:main"

[tool.uv]
# windows-capture's Python wrapper (windows_capture/__init__.py) imports cv2 and numpy for its own helpers; DoMe
# never imports it (capture_wgc.load_native loads the Rust extension by file), so neither is installed or frozen.
# opencv-python would also bring a second FFmpeg (cv2/opencv_videoio_ffmpeg*.dll) outside av.libs, which the
# licence gate refuses (licence_gate.py F1).
exclude-dependencies = ["opencv-python", "numpy"]

[tool.uv.sources]
dome-protocol = { path = "../shared/python", editable = true }
# Windows builds take DoMe's own LGPL PyAV wheel (no GPL x264/x265 in it), built and licence-gated by
# .github/workflows/ffmpeg-lgpl.yml run 39840865306 and published as a pre-release; uv.lock pins its SHA-256
# (90cbe910...f39d). Linux and macOS keep the PyPI wheel for development. licence_gate.py shipping-av checks this.
av = { url = "https://github.com/Heshh999/DoMe/releases/download/av-lgpl-17.1.0-ffmpeg-n8.1.3-r3/av-17.1.0+lgpl.ffmpeg8.1.3-cp311-abi3-win_amd64.whl", marker = "sys_platform == 'win32'" }

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["dome_agent"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
filterwarnings = ["error::DeprecationWarning:dome_agent.*"]

[tool.ruff]
line-length = 120
target-version = "py312"
extend-exclude = ["packaging"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "N", "ASYNC"]
ignore = ["S101", "S603", "E501"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S", "B", "ASYNC"]
"dome_agent/testing/*" = ["S"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = false
ignore_missing_imports = true
packages = ["dome_agent"]
exclude = ["packaging/"]
mypy_path = "../shared/python"

[[tool.mypy.overrides]]
# Real Windows APIs (winreg attributes, ctypes.WinDLL, pywin32) have no stubs on the Linux build host.
module = ["dome_agent.platform.windows.*"]
disable_error_code = ["attr-defined", "no-any-return"]
