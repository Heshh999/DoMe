# Type-checks the Windows code paths (sys.platform == "win32") against the pywin32 stubs:
#   uv run mypy --config-file mypy-windows.ini
# The default run (pyproject.toml) checks Linux paths and exempts the Windows adapters from attribute
# checks, because pywin32, winreg and ctypes.WinDLL do not exist on Linux. This run covers them.
[mypy]
python_version = 3.12
platform = win32
strict = True
warn_unreachable = False
ignore_missing_imports = True
packages = dome_agent
exclude = packaging/
mypy_path = ../shared/python

[mypy-dome_agent.platform.windows.*]
# pycaw, comtypes and winsdk have no stubs: values from them are Any.
disable_error_code = no-any-return
