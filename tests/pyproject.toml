[project]
name = "dome-integration-tests"
version = "0.1.0"
description = "Cross-component integration tests: real cloud-api + PostgreSQL + dev-idp, the real dome-agent process (fake platform), a fake extension on the agent's bridge socket, and a Python-signed controller."
requires-python = ">=3.12,<3.13"
dependencies = [
    "dome-protocol",
    "dome-api",
    "dome-agent",
    "pytest>=9.1.1,<10",
    "pytest-asyncio>=1.3.0,<2",
    "httpx>=0.28.1,<1",
    "websockets>=17.2,<18",
    "psycopg[binary]>=3.3.6,<4",
    "sqlalchemy>=2.0.40,<2.1",
    "uvicorn[standard]>=0.54.0,<1",
]

[tool.uv.sources]
dome-protocol = { path = "../shared/python", editable = true }
dome-api = { path = "../cloud-api", editable = true }
dome-agent = { path = "../pc-agent", editable = true }

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["."]
python_files = ["test_*.py"]
filterwarnings = ["error::pytest.PytestUnraisableExceptionWarning"]
