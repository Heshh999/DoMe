<?xml version="1.0" encoding="UTF-8"?>
<!-- DoMe app icon for dark surfaces: an elevated tile with a border so it separates from Night backgrounds.
     Same glyph geometry as icon.svg. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-labelledby="dome-icon-dark-title">
  <title id="dome-icon-dark-title">DoMe</title>
  <desc>A teal dome arc over a dot on a dark slate rounded tile with a thin border.</desc>
  <rect id="dome-icon-dark-tile" x="1" y="1" width="62" height="62" rx="13" fill="#182033" stroke="#37445f" stroke-width="2"/>
  <g id="dome-icon-dark-glyph">
    <path d="M15 39A17 17 0 0 1 49 39" fill="none" stroke="#5ee1c0" stroke-width="6" stroke-linecap="round"/>
    <circle cx="32" cy="39" r="5.5" fill="#5ee1c0"/>
  </g>
</svg>
