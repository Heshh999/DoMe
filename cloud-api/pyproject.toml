[project]
name = "dome-api"
version = "0.1.0"
description = "DoMe cloud backend and relay: FastAPI REST, WebSocket relay, PostgreSQL."
requires-python = ">=3.12"
dependencies = [
    "dome-protocol",
    "fastapi>=0.142.4,<1",
    "uvicorn[standard]>=0.54.0,<1",
    "sqlalchemy[asyncio]>=2.0.40,<2.1",
    "psycopg[binary]>=3.3.6,<4",
    "alembic>=1.20.0,<2",
    "pydantic>=2.13.5,<3",
    "pydantic-settings>=2.15.0,<3",
    "authlib>=1.8.0,<2",
    "joserfc>=1.7.5,<2",
    "structlog>=26.1.0,<27",
    "httpx>=0.28.1,<1",
    "httpx2>=2.13.1,<3",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.1.1,<10",
    "pytest-asyncio>=1.3.0,<2",
    "websockets>=17.2,<18",
    "mypy>=1.20,<3",
    "ruff>=0.16.10,<0.17",
]

[project.scripts]
dome-api = "dome_api.cli:main"
dome-api-gen-entitlement-key = "dome_api.keygen:main"

[tool.uv.sources]
dome-protocol = { path = "../shared/python", editable = true }

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["dome_api"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]
filterwarnings = ["error::pytest.PytestUnraisableExceptionWarning"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "ASYNC", "N", "W"]
ignore = ["S101", "B008", "S104", "S311", "S608"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S", "ASYNC", "E501"]
"dome_api/db/alembic/*" = ["E501"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
warn_unused_ignores = false
disallow_untyped_decorators = false
exclude = ["dome_api/db/alembic/"]

[[tool.mypy.overrides]]
module = ["authlib.*", "joserfc.*", "dome_protocol", "dome_protocol.*"]
ignore_missing_imports = true
