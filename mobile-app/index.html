<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#001441" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#f6f8fc" media="(prefers-color-scheme: light)" />
    <!-- The saved light/dark choice, applied before the first paint (external: the CSP allows no inline script). -->
    <script src="/theme-init.js"></script>
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="DoMe" />
    <meta name="description" content="DoMe Remote — your iPhone becomes a simple, secure remote for your own Windows PC." />
    <meta name="referrer" content="same-origin" />
    <!-- Link previews (iMessage, WhatsApp, social sites): crawlers need absolute URLs on the one canonical
         origin, https://domeremote.com (domeremote.app redirects there; see deploy/README.md "Domain"). -->
    <meta property="og:site_name" content="DoMe Remote" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="DoMe Remote — your PC, in your hand" />
    <meta property="og:description" content="Your iPhone becomes a simple, secure remote for your own Windows PC. Free to start." />
    <meta property="og:image" content="https://domeremote.com/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="The DoMe Remote logo on navy: Your PC, in your hand." />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="icon" href="/icons/favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="/icons/favicon-32.png" type="image/png" sizes="32x32" />
    <link rel="icon" href="/icons/favicon-16.png" type="image/png" sizes="16x16" />
    <link rel="alternate icon" href="/icons/favicon.ico" sizes="16x16 32x32 48x48" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <title>DoMe Remote</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
